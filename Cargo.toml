[package]
name = "blosc-src"
version = "0.3.6"
authors = ["Magnus Ulimoen <magnus@ulimoen.dev>"]
edition = "2021"
rust-version = "1.64"
build = "build.rs"
links = "blosc"
license-file = "c-blosc/LICENSE.txt"
exclude = [
    "c-blosc/compat/**",
    "c-blosc/tests/**",
    "c-blosc/bench/**",
    "c-blosc/internal-complibs/**",
]
repository = "https://github.com/mulimoen/rust-blosc-src"
keywords = ["compression"]
categories = ["external-ffi-bindings", "compression"]
description = "FFI bindings for blosc-c"
readme = "README.md"

[features]
zlib = ["dep:libz-sys"]
zstd = ["dep:zstd-sys", "dep:zstd", "dep:zstd-safe"]
lz4 = ["dep:lz4-sys"]
snappy = ["dep:snappy_src"]
no_wasm_shim = [] # Disable wasm shims (in case your wasm toolchain includes a C stdlib).

[build-dependencies]
cc = "1.0"

[dependencies]
libz-sys = { version = "1.1.12", optional = true, default-features = false, features = ["static", "libc"] }
zstd = { version = "*", features = [
    "wasm",
    "thin",
], default-features = false, optional = true }
zstd-sys = { version = "=2.0.9", optional = true, default-features = false }
zstd-safe = { version = "*", optional = true, default-features = false }

lz4-sys = { version = "1.9.4", optional = true }
snappy_src = { version = "0.2.2", optional = true }
web-sys = { version = "0.3", features = ["console"] }

[dev-dependencies]
wasm-bindgen = { version = "0.2.100" }
wasm-bindgen-test = "0.2"

# This section is key for wasm-bindgen-test to find your integration tests.
[[test]]
name = "test" # This should match the filename in the tests/ directory.
harness = false

